[project]
name = "v2t-single"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=0.8.0",
    "langgraph>=0.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "langchain-google-genai>=4.2.2",
    "scenedetect>=0.7",
    # synthesis dependencies
    "moviepy>=2.2.1",
    "openai>=2.29.0",
    "elevenlabs>=2.40.0",
    "scipy>=1.17.0",
    "numpy>=2.4.0",
    "langfuse<3.0.0",
]

[project.scripts]
v2t-run = "v2t_single.run:main"
v2t-parallel-run = "v2t_single.parallel_run:main"
v2t-batch-prepare = "v2t_single.batch_prepare:main"
v2t-batch-submit = "v2t_single.batch_submit:main"
v2t-batch-collect = "v2t_single.batch_collect:main"
v2t-rebuild-report = "v2t_single.rebuild_report:main"
v2t-scene-detect-report = "v2t_single.scene_detect_report:main"
v2t-synthesize = "v2t_single.synthesize:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.26",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
